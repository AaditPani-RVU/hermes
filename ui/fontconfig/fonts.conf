<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Hermes-only font config: system fonts, but colour emoji win over DejaVu's
     monochrome symbols. Loaded via FONTCONFIG_FILE by the hermes-ui launcher. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong">
    <family>Google Sans Flex</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
</fontconfig>
